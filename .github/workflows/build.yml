name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Inspect APK diagnostic
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          echo "=== APK BADGING ==="
          "$AAPT2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|launchable-activity|application-label:" || true
          echo "=== APK FILES ==="
          unzip -l "$APK" | grep -E "classes.*dex|AndroidManifest.xml" || true
          echo "=== MainActivity check ==="
          unzip -p "$APK" 'classes*.dex' | grep -a -c "com/hanmark/world/MainActivity" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HanMarkWorld-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
