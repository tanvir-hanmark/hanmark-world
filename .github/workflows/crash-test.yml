name: HanMark Emulator Crash Test

on:
  workflow_dispatch:

jobs:
  crash-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Enable KVM (makes the emulator fast)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in emulator and record log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.hanmark.world/.MainActivity
            sleep 10
            adb shell pidof com.hanmark.world || echo "APP PROCESS IS NOT RUNNING"
            adb logcat -d > logcat-full.txt

      - name: Show crash lines
        if: always()
        run: |
          if [ -f logcat-full.txt ]; then
            echo "=== FATAL EXCEPTION blocks ==="
            grep -a -A 25 "FATAL EXCEPTION" logcat-full.txt | head -100 || true
            echo "=== Other lines mentioning the app ==="
            grep -a "com.hanmark.world" logcat-full.txt | head -60 || true
          else
            echo "No log file was created"
          fi

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: logcat-full.txt
          if-no-files-found: ignore
